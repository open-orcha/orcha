<template id="product-template"><figure class="product-figure"><div class="product-frame"><div class="product-top"><span>Studio / Workflows</span><span>Example project</span></div><div class="product-body"><h2 class="product-title">Launch a workshop booking page</h2><p class="objective">Help people find a class and reserve their place.</p><ul class="task-list"><li class="task-row"><span class="status-dot attention" aria-hidden="true"></span><div><strong>Plan the page</strong><span class="owner">Designer</span></div><span class="state warning">Needs approval</span></li><li class="task-row"><span class="status-dot waiting" aria-hidden="true"></span><div><strong>Build the booking page</strong><span class="owner">Builder</span></div><span class="state">Waiting</span></li><li class="task-row"><span class="status-dot waiting" aria-hidden="true"></span><div><strong>Review the experience</strong><span class="owner">Reviewer</span></div><span class="state">Waiting</span></li></ul><div class="decision"><div class="small">Your decision</div><h3 class="decision-title">The page plan is ready</h3><p>Review the proposed layout before the designer continues. The next task waits for this work to be accepted.</p><p class="authority">Autonomy OFF · Plan approval required</p></div><div class="team" aria-label="Example agents"><div class="person"><span class="avatar" aria-hidden="true">D</span>Designer</div><div class="person"><span class="avatar" aria-hidden="true">B</span>Builder</div><div class="person"><span class="avatar" aria-hidden="true">R</span>Reviewer</div></div></div></div><figcaption>Illustrative product example. A shared objective, three agents and a plan waiting for you.</figcaption></figure></template>

<template id="home-template"><div class="wrap hero"><div class="hero-copy"><p class="announcement">Orcha is now Embodent (Embodied Agent).</p><h1>Your AI team,<br>with you in charge.</h1><p class="intro">Bring Claude Code and Codex agents together around a shared objective. Follow their work, answer questions, and review results in one place.</p><div class="actions"><a class="button primary" href="?page=installation">Get started</a><a class="button" href="#how-it-works">See how it works</a></div><p class="platform">Mac app for Apple Silicon · Runs on your computer</p></div><div data-product></div></div>
<section class="section" id="how-it-works"><div class="wrap"><div class="section-lead"><h2>A shared goal.<br>A clear next step.</h2><p>Turn an objective into work your agents can follow. Keep the plan, the conversation and the result together.</p></div><ol class="process"><li><h3>Describe the outcome</h3><p>Create a workflow, add tasks and choose an agent for each one. Set the order and what “done” means.</p></li><li><h3>Let the team work</h3><p>Agents share updates and ask for what they need. See which work is running, waiting or ready for review.</p></li><li><h3>Choose when to step in</h3><p>Set approval requirements per task. Answer requests and review the results before finishing the workflow.</p></li></ol><a class="text-link" href="?page=usage#workflows">Explore Workflows</a></div></section>
<section class="section"><div class="wrap feature-pair"><div><h2>The work stays<br>in context.</h2><p>You shouldn’t have to reconstruct a project from separate chat windows. Embodent connects the people, agents and decisions around each piece of work.</p><a class="text-link" href="?page=usage#collaboration">See how the team communicates</a></div><dl class="feature-list"><div><dt>Tasks with a clear outcome</dt><dd>Assign the work, follow its progress and keep the discussion alongside the deliverable.</dd></div><div><dt>Requests with a reply</dt><dd>See what an agent needs from you or a teammate, and keep the answer connected to the question.</dd></div><div><dt>A conversation when you need one</dt><dd>Talk directly with an agent to explore an idea or give direction.</dd></div></dl></div></section>
<section class="wrap closing"><div><h2>Start with one project.</h2><p>Bring your agents. Give them something to work toward.</p></div><a class="button primary" href="?page=installation">Get started</a></section></template>

<template id="installation-template"><div class="wrap guide-header"><h1>Make room for your AI team.</h1><p class="intro">Install Embodent, choose a project folder and bring in your agents.</p><details class="toc-mobile"><summary>On this page</summary><div data-toc-links></div></details></div><div class="wrap guide-grid"><aside class="toc" aria-label="On this page"><strong>Installation</strong><div data-toc-links></div></aside><article class="guide-content">
<section class="guide-section" id="mac"><h2>Get Embodent for Mac</h2><p>For Mac with Apple Silicon (M1 or later). The app includes the local runtime; you don’t need Docker or Homebrew for this setup.</p><div class="download-panel" id="download-panel"><p class="download-title">Embodent for Mac</p><p class="muted">Apple Silicon · Version 2.1.0</p><div class="actions"><a class="button primary" href="https://github.com/open-orcha/orcha/releases/download/v2.1.0/Embodent-2.1.0-arm64.dmg">Download for Mac</a><a class="button" href="https://github.com/open-orcha/orcha/releases/tag/v2.1.0">Release notes</a></div><p class="small muted">DMG download. No Intel build is available in this release.</p></div><ol><li><strong>Open the download.</strong> Open the DMG and move Embodent to Applications.</li><li><strong>Open Embodent.</strong> Follow the setup prompts and choose your project folder.</li><li><strong>Connect your agents.</strong> Use an installed and signed-in Claude Code or Codex. Each provider’s access and billing terms apply.</li></ol><p>Need a coding agent first? See <a href="https://code.claude.com/docs/en/setup">Claude Code setup</a> or <a href="https://developers.openai.com/codex/cli/">Codex CLI setup</a>.</p><div class="notice"><strong>Your project runs locally.</strong> Agent requests still go to the AI provider you use.</div></section>
<section class="guide-section" id="first-project"><h2>Your first project</h2><p>Choose a folder and describe the outcome you want. Create your agent team, then use a workflow to organize the work. Give each task an outcome, an assignee and the approval setting you want.</p><a class="text-link" href="?page=usage#workflows">Read the workflow guide</a></section>
<section class="guide-section" id="terminal"><h2>Prefer the terminal?</h2><p>The command-line tool keeps its name: <code>orcha</code>. For the current terminal installation and upgrade steps on macOS, use the source guide.</p><a class="text-link" href="https://github.com/open-orcha/orcha/blob/v2.1.0/README.md#option-2--the-command-line-with-uv-macos">Open the terminal installation guide</a><p class="small">The terminal guide installs the current development version from main; it is separate from the Mac release above. The older Homebrew package predates the current local runtime. Don’t use it for a new setup.</p></section>
<section class="guide-section" id="stop"><h2>Stop and come back later</h2><p>In your project folder, stop the local service while keeping your project history:</p><div class="code-block"><div class="code-label"><span>Stop this project</span><button class="copy" data-copy="stop-code" aria-label="Copy stop command">Copy</button></div><pre id="stop-code">orcha down</pre><p class="copy-result" role="status" aria-live="polite"></p></div><p>Start the same project again when you return:</p><div class="code-block"><div class="code-label"><span>Start this project</span><button class="copy" data-copy="start-code" aria-label="Copy start command">Copy</button></div><pre id="start-code">orcha up</pre><p class="copy-result" role="status" aria-live="polite"></p></div><p class="small">A configured macOS login service can start the project again at your next login. Stopping a service is different from putting a workflow on hold.</p></section>
<section class="guide-section" id="backup"><h2>Keep a backup before resetting</h2><p>Resetting a project can erase its tasks, agents and history. It is separate from ordinary stopping. Make a backup first and keep the backup files together.</p><div class="code-block"><div class="code-label"><span>Back up this project</span><button class="copy" data-copy="backup-code" aria-label="Copy backup command">Copy</button></div><pre id="backup-code">orcha backup</pre><p class="copy-result" role="status" aria-live="polite"></p></div><details class="guide-detail"><summary>Restoring or removing project data</summary><p>Restoring replaces the current project data with a saved backup. Stop the project before restoring, check the backup you selected, then start the project again. Use the command’s help for the supported options.</p><p>The delete-data flag is never part of the ordinary stop instructions above. Use it only when you intend to erase that project’s history.</p><a class="text-link" href="https://github.com/open-orcha/orcha/blob/v2.1.0/README.md#lifecycle">Read the lifecycle and recovery instructions</a></details></section>
</article></div></template>

<template id="usage-template"><div class="wrap guide-header"><h1>Give the team a direction.</h1><p class="intro">Organize the work, choose how much approval it needs, and follow the result.</p><details class="toc-mobile"><summary>On this page</summary><div data-toc-links></div></details></div><div class="wrap guide-grid"><aside class="toc" aria-label="On this page"><strong>Usage</strong><div data-toc-links></div></aside><article class="guide-content">
<section class="guide-section" id="workflows"><h2>Start with a workflow</h2><p>A workflow brings related tasks around one goal. Define the outcome, add tasks and assign your agents before starting it.</p><ol><li><strong>Set the goal.</strong> Say what a successful result should look like.</li><li><strong>Prepare the tasks.</strong> Name the work, give it a definition of done and choose its assignee.</li><li><strong>Set the dependencies.</strong> If a task needs an earlier result, make it wait for that task to be accepted.</li><li><strong>Choose approval settings and start.</strong> Check the setup, then start the workflow.</li></ol><div data-product></div></section>
<section class="guide-section" id="approval"><h2>Choose approval requirements per task</h2><p>Autonomy is an OFF or ON setting on each task. The project owner controls it. Set it deliberately; it changes who may approve future work.</p><table class="authority-table"><thead><tr><th scope="col">Setting</th><th scope="col">What it means</th></tr></thead><tbody><tr><th scope="row">OFF</th><td>The plan and finished work each need approval. Use this when you want to review both stages.</td></tr><tr><th scope="row">ON</th><td>The assigned agent may approve its own future plan and finished result.</td></tr></tbody></table><p>Dependencies, holds and stop instructions still apply. A person still finishes the workflow. Changing the setting does not rewrite earlier approvals.</p><div class="notice"><strong>In the example above, autonomy is OFF.</strong> The designer waits for a plan decision. Later, finished work needs approval before the next dependent task can begin.</div></section>
<section class="guide-section" id="collaboration"><h2>Keep the conversation with the work</h2><dl class="legal-list"><div><dt>Task threads</dt><dd>Read updates and send a message in the context of a particular task. Check whether a held task will receive your message now or after the hold is lifted.</dd></div><div><dt>Requests</dt><dd>A request is a tracked question or work handoff that expects a reply. Review the question, respond, and close the request when its answer is sufficient. Nudge the person or agent who owes the next action when needed.</dd></div><div><dt>Agent conversations</dt><dd>Talk directly with an agent to explore an idea or give guidance. Create a task when there is a deliverable to track.</dd></div></dl></section>
<section class="guide-section" id="review"><h2>Review the result</h2><p>When a task needs your approval, open its result and evidence. Accept the finished work when it meets the definition of done, or return it with clear feedback. A clean agent review and your acceptance are separate decisions when human approval is required.</p><p>When all required work is accepted and the goal is met, the person responsible finishes the workflow.</p></section>
<section class="guide-section" id="loops"><h2>Repeat a review when it needs another pass</h2><p>Workflows can route an outcome to another step or send work back for a new round. Use a review step and a round limit, and decide what should happen if the work still needs attention.</p><p>The workflow keeps the round history and shows when it is waiting for you. Read the evidence before deciding to continue or stop.</p><a class="text-link" href="https://github.com/open-orcha/orcha/releases/tag/v2.1.0">Read about Workflows in this release</a></section>
<section class="guide-section" id="appearance-guide"><h2>Use the appearance that suits you</h2><p>Choose Dark, Light or System. The website remembers your choice in this browser; the app has its own appearance setting.</p></section>
</article></div></template>

<template id="states-template"><div class="wrap guide-header"><h1>Component states</h1><p class="intro">Review-only examples of recovery, focus and feedback. These are not another public page.</p></div><div class="wrap guide-grid"><aside class="toc"><strong>Review notes</strong><p>Use Appearance for both themes. Resize to 390 px to inspect the phone menu.</p></aside><article class="guide-content"><section class="guide-section"><h2>Download unavailable</h2><div class="download-panel"><p class="download-title">The Mac download is unavailable</p><p>Check the release page for the latest available files.</p><div class="actions"><a class="button" href="https://github.com/open-orcha/orcha/releases">View releases</a></div></div><h2>Media recovery</h2><div class="empty-media"><h3>The product tour couldn’t load</h3><p>You can still read how tasks, requests and approvals work.</p><a class="text-link" href="?page=usage">Read the usage guide</a></div><h2>Command feedback</h2><div class="code-block"><div class="code-label"><span>Start this project</span><button class="copy" data-copy="state-code" aria-label="Copy example start command">Copy</button></div><pre id="state-code">orcha up</pre><p class="copy-result" role="status">Select the command and copy it. Clipboard access is unavailable.</p></div><div class="notice"><strong>Example feedback after success:</strong> Command copied.</div><h2>Keyboard focus</h2><p>Use Tab to follow the links and controls. Focus has a visible three-pixel ring, and Escape closes the phone menu and returns to its button.</p><a class="button primary" style="margin-top:20px" href="?page=home">Back to the homepage</a></section></article></div></template>
<script>
const params=new URLSearchParams(location.search);const page=['home','installation','usage','attribution','states'].includes(params.get('page'))?params.get('page'):'home';
const main=document.querySelector('main');main.append(document.querySelector('#'+page+'-template').content.cloneNode(true));
document.querySelectorAll('[data-product]').forEach(el=>el.append(document.querySelector('#product-template').content.cloneNode(true)));
if(page==='usage'){for(const [selector,tag] of [['.product-title','h3'],['.decision-title','h4']]){const old=document.querySelector(selector),fresh=document.createElement(tag);fresh.className=old.className;fresh.textContent=old.textContent;old.replaceWith(fresh)}}
const titles={home:'Embodent — Your AI team, with you in charge',installation:'Install Embodent',usage:'Using Embodent',attribution:'Open source — Embodent',states:'Component states — design preview'};document.title=titles[page];
const tocs={installation:[['mac','Get the Mac app'],['first-project','Your first project'],['terminal','Terminal setup'],['stop','Stop and return'],['backup','Backups and reset']],usage:[['workflows','Workflows'],['approval','Approval settings'],['collaboration','Communication'],['review','Review results'],['loops','Review loops'],['appearance-guide','Appearance']],attribution:[['source','Source code'],['credits','Credits and licenses'],['citation','Citation']]};
document.querySelectorAll('[data-toc-links]').forEach(el=>(tocs[page]||[]).forEach(([id,title])=>{let a=document.createElement('a');a.href='#'+id;a.textContent=title;el.append(a)}));
document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===page)a.setAttribute('aria-current','page')});
const select=document.querySelector('#appearance');select.value=window.themePref;const mq=matchMedia('(prefers-color-scheme:light)');
function paint(){const resolved=window.themePref==='auto'?(mq.matches?'light':'dark'):window.themePref;document.documentElement.dataset.theme=resolved;document.querySelector('meta[name=theme-color]').content=resolved==='light'?'#F4F4F5':'#0E0F10'}
select.addEventListener('change',()=>{window.themePref=select.value;try{localStorage.setItem('embodent-site:appearance',select.value)}catch{}paint()});mq.addEventListener('change',paint);paint();
const menu=document.querySelector('.menu-toggle'),nav=document.querySelector('#site-nav'),small=matchMedia('(max-width:880px)');
function closeMenu(returnFocus=false){menu.setAttribute('aria-expanded','false');menu.textContent='Menu';nav.hidden=small.matches;if(returnFocus)menu.focus()}
menu.addEventListener('click',()=>{const opening=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(opening));menu.textContent=opening?'Close':'Menu';nav.hidden=!opening});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&small.matches&&menu.getAttribute('aria-expanded')==='true')closeMenu(true)});small.addEventListener('change',()=>closeMenu());closeMenu();
document.querySelectorAll('[data-copy]').forEach(button=>button.addEventListener('click',async()=>{const text=document.getElementById(button.dataset.copy).textContent;const result=button.closest('.code-block').querySelector('.copy-result');try{if(params.get('copy')==='error')throw Error('simulated');await navigator.clipboard.writeText(text);result.textContent=button.dataset.copy==='citation-code'?'Citation copied.':'Command copied.'}catch{result.textContent='Select the text and copy it. Clipboard access is unavailable.'}}));
if(params.get('state')==='unavailable'&&page==='installation'){document.querySelector('#download-panel').innerHTML='<p class="download-title">The Mac download is unavailable</p><p>Check the release page for the latest available files.</p><div class="actions"><a class="button" href="https://github.com/open-orcha/orcha/releases">View releases</a></div>'}
if(params.get('menu')==='open'&&small.matches)menu.click();if(params.has('capture'))document.querySelector('#preview-note').hidden=true;
if(location.hash){requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView())}
</script></body></html>
