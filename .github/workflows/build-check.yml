name: build-check

# Runs on EVERY pull request (no path filter): `build` is a required status
# check on main, and a path-filtered workflow never reports on PRs outside its
# paths — the required check would sit "Expected" forever and block the merge.
# The job is ~1 minute, so always-run is a cheap price for a sound gate.
on:
  pull_request:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted runner. This repo is PRIVATE, so Actions minutes are billed —
    # timeout-minutes hard-stops a wedged build instead of idling on paid time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build sdist + wheel, twine check, wheel smoke test
        run: |
          python -m pip install --upgrade pip build twine
          python -m build orcha-cli --outdir dist
          twine check dist/*
          python -m venv .smoke-venv
          ./.smoke-venv/bin/pip install dist/*.whl
          ./.smoke-venv/bin/orcha --version

      - name: Clean up
        if: always()
        run: rm -rf .smoke-venv dist
