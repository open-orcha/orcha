[project]
name = "orcha-cli"
version = "0.5.1"
description = "Orcha: human-authoritative multi-agent orchestration via Claude Code skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Orcha contributors" }]
requires-python = ">=3.10"
# S3 §3b: the host-side live-terminal PTY/websocket bridge (`orcha terminal-bridge`) needs a
# websocket server. Imported lazily, so the rest of the CLI still runs if it's not yet installed.
# GH #258: `orcha portal` runs the packaged portal in this interpreter, so the portal's own
# requirements (templates/portal/requirements.txt) are CLI dependencies too. psycopg goes
# away with the SQLite cutover.
dependencies = [
  "websockets>=12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "qrcode>=8",
  "psycopg[binary]>=3.1",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
# `orcha qa` (docs/orcha-qa-plan.md): the MCP tool server and the device layer that drives an
# iOS simulator (idb_companion + fb-idb) or an Android emulator (uiautomator2 + adb). Imported
# lazily, so the base CLI never needs them.
qa = [
  "mcp>=2.2",
  "fb-idb>=1.1.7",
  "uiautomator2>=3.5",
  "adbutils>=2.9.3",
  "pillow>=10",
  "playwright>=1.62,<2",
  "httpx>=0.27",  # the physical iPhone session speaks WebDriver to its local Appium server
]

[project.urls]
Homepage = "https://github.com/open-orcha/orcha"
Issues = "https://github.com/open-orcha/orcha/issues"
Changelog = "https://github.com/open-orcha/orcha/blob/main/CHANGELOG.md"

[project.scripts]
orcha = "orcha_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "orcha_cli/**/*.py",
  "orcha_cli/qa/device/*.js",
  "orcha_cli/templates/**",
]
# The built React bundle ships INSIDE the package (stacks serve it with no Node
# toolchain). Git tracks it via a .gitignore negation (!.../static/dist/), but
# hatchling's ignore handling drops it anyway — `artifacts` force-includes it.
artifacts = [
  "orcha_cli/templates/portal/static/dist/**",
]

[tool.hatch.build.targets.wheel]
packages = ["orcha_cli"]
