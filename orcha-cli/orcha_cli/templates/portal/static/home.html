<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orcha · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles/tokens.css">
<link rel="stylesheet" href="/assets/styles/shell.css">
<link rel="stylesheet" href="/assets/styles/components.css">
<link rel="stylesheet" href="/assets/styles/overlays.css">
<link rel="stylesheet" href="/assets/styles/conversation.css">
<link rel="stylesheet" href="/assets/styles/responsive.css">
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem('orcha:theme')||'auto',s=localStorage.getItem('orcha:skin'),b=localStorage.getItem('orcha:sidebar');d.setAttribute('data-theme',t);if(s&&s!=='classic')d.setAttribute('data-skin',s);if(b==='collapsed')d.setAttribute('data-sidebar','collapsed');}catch(e){document.documentElement.setAttribute('data-theme','auto');}})();</script>
<link rel="stylesheet" href="/assets/pages/home.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">

      <div class="ctxbar" id="ctxbar"></div>

      <div id="onbCta"></div>
      <!-- Empty-state contract: pages/home-state.js renders href="/onboarding"
           only when its snapshot check finds a.kind !== "human". -->

      <section id="needs">
        <div class="hero-h">
          <span class="t">Needs your attention</span>
          <span class="badge tnum" id="aqBadge">0</span>
          <span class="sub">Plans to approve and tasks to verify — one click from acting. Nothing ships on an agent's say-so.</span>
        </div>
        <div class="aq-grid" id="aqGrid"></div>
      </section>

      <div class="dash-grid">
        <div class="card">
          <div class="card-h">
            <h2>Agents at a glance</h2><span class="count" id="agCount"></span>
            <span class="grow"></span>
            <a class="seeall" href="/onboarding?new=1">+ New agent</a>
            <a class="seeall" href="/agents" style="margin-left:12px">All agents ↗</a>
          </div>
          <div class="card-b flush" style="overflow-x:auto">
            <table class="tbl" id="agTbl"></table>
          </div>
        </div>

        <div class="card stick">
          <div class="card-h">
            <h2>Live activity</h2>
            <span class="grow"></span>
            <span class="live accent"><span class="d"></span>live</span>
          </div>
          <div class="card-b"><div class="act-list" id="actList"></div></div>
        </div>
      </div>

      <div class="section-title"><h2>Tasks by status</h2><span class="ln"></span>
        <a class="seeall" href="/tasks">Open tasks ↗</a></div>
      <div class="kanban" id="kanban"></div>

    </div>
  </div>
</div>

<script src="/assets/modules/app-state.js"></script>
<script src="/assets/modules/app-text.js"></script>
<script src="/assets/modules/app-data.js"></script>
<script src="/assets/modules/app-ui.js"></script>
<script src="/assets/modules/app-shell.js"></script>
<script src="/assets/modules/app-autonomy.js"></script>
<script src="/assets/modules/app-notifications.js"></script>
<script src="/assets/modules/app-pairing.js"></script>
<script src="/assets/modules/app-patch-log.js"></script>
<script src="/assets/modules/app-run-classify.js"></script>
<script src="/assets/modules/app-run-stream.js"></script>
<script src="/assets/modules/app-sort.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/data.js"></script>
<script src="/assets/pages/home-state.js"></script>
<script src="/assets/pages/home-render.js"></script>
</body>
</html>
