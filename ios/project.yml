# Orcha iOS companion — XcodeGen project definition (GH #30, design package
# docs/design/mobile). Generate with `xcodegen generate`; no Xcode GUI needed.
#
# Device runs: signing is OFF by default so CI and cert-less contributors can
# build. To run on hardware (CLI or Xcode Command-R), create ios/project.local.yml
# (gitignored) as a wrapper spec that includes this file and overrides the
# target-level signing settings:
#   include:
#     - project.yml
#   targets:
#     Orcha:
#       settings: {base: {DEVELOPMENT_TEAM: YOURTEAMID, CODE_SIGNING_ALLOWED: "YES"}}
#     OrchaWidgetsExt:
#       settings: {base: {DEVELOPMENT_TEAM: YOURTEAMID, CODE_SIGNING_ALLOWED: "YES"}}
# then run `xcodegen generate --spec project.local.yml`.
name: Orcha
options:
  bundleIdPrefix: io.openorcha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Orcha:
    type: application
    platform: iOS
    sources:
      - path: Orcha
      - path: Shared
    dependencies:
      - target: OrchaWidgetsExt
        embed: true
    entitlements:
      path: Orcha/Orcha.entitlements
      properties:
        com.apple.security.application-groups: [group.io.openorcha.mobile]
    info:
      path: Orcha/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Orcha
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIAppFonts:
          - SpaceGrotesk.ttf
        NSCameraUsageDescription: "Orcha uses the camera only to scan the pairing QR from your portal."
        NSMicrophoneUsageDescription: "Orcha uses the microphone only while you dictate a message to your agents. Speech is transcribed on this device — audio never leaves your phone."
        NSSpeechRecognitionUsageDescription: "Dictated audio is transcribed to editable text on this device."
        # Arbitrary loads ONLY — do not re-add NSAllowsLocalNetworking beside it:
        # when both keys are present iOS treats ArbitraryLoads as a legacy fallback
        # and enforces just the granular key, which silently re-blocks the opt-in
        # remote path (Tailscale 100.64/10 + *.ts.net are not "local" to ATS).
        # Verified live: Safari reached the portal over the tailnet while the app's
        # URLSession got blocked with both keys set. The app only ever talks to
        # addresses the user typed or scanned.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Orcha connects to the Orcha server running on your computer over your local network."
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - io.openorcha.mobile.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: io.openorcha.mobile
            CFBundleURLSchemes: [orcha]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.openorcha.mobile.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - OrchaTests
      gatherCoverageData: false
  OrchaWidgetsExt:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Orcha
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/OrchaWidgetsExt.entitlements
      properties:
        com.apple.security.application-groups: [group.io.openorcha.mobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.openorcha.mobile.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
  OrchaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrchaTests
    dependencies:
      - target: Orcha
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Orcha.app/Orcha"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: "YES"
